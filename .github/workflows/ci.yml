name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-validation:
    name: Release validation baseline
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      INVOMATCH_RELEASE_COMMIT_SHA: ${{ github.sha }}
      INVOMATCH_RELEASE_BRANCH: ${{ github.ref_name }}
      INVOMATCH_RELEASE_VALIDATION_STATUS: not_declared

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest httpx python-multipart

      - name: Prepare pytest temp root
        run: |
          mkdir -p .pytest_tmp

      - name: Backend full test baseline
        run: |
          pytest -q tests --basetemp=.pytest_tmp/backend_full

      - name: Contract tests
        run: |
          pytest -q \
            tests/contracts \
            tests/sqlite_contract \
            tests/test_artifact_storage_contract.py \
            tests/test_export_artifact_repository_contract.py \
            tests/test_run_store_core_contract.py \
            tests/test_run_view_contract.py \
            tests/domain/test_feedback_time_contract.py \
            --basetemp=.pytest_tmp/contracts

      - name: Operational tests
        run: |
          pytest -q tests/operational --basetemp=.pytest_tmp/operational

      - name: Required scenario regression pack
        run: |
          pytest -q \
            tests/system/test_happy_path_full_flow.py \
            tests/system/test_review_resolution_flow.py \
            tests/system/test_runtime_failure_terminalization.py \
            tests/system/test_startup_repair_visibility_recovery_alignment.py \
            --basetemp=.pytest_tmp/scenario_pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/invomatch-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui/invomatch-ui
        run: npm ci

      - name: Frontend lint
        working-directory: ui/invomatch-ui
        run: npm run lint

      - name: Frontend build
        working-directory: ui/invomatch-ui
        run: npm run build

      - name: Pilot runtime composition smoke test
        env:
          INVOMATCH_SECURITY_SEED_TOKENS_JSON: >-
            [{"token":"ci-pilot-credential","user_id":"ci-pilot-user","username":"ci-pilot","role":"admin","status":"active","tenant_id":"ci-pilot-tenant"}]
          INVOMATCH_SESSION_COOKIE_SECURE: "false"
          INVOMATCH_RELEASE_COMMIT_SHA: ${{ github.sha }}
          INVOMATCH_RELEASE_BRANCH: ${{ github.ref_name }}
          INVOMATCH_RELEASE_VALIDATION_STATUS: ci_smoke
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f docker-compose.pilot.yml down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose -f docker-compose.pilot.yml config --quiet
          docker compose -f docker-compose.pilot.yml up --detach --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/health > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/readiness > /dev/null
          curl --fail --silent --show-error \
            --cookie-jar pilot.cookies \
            --header 'Content-Type: application/json' \
            --data '{"credential":"ci-pilot-credential"}' \
            http://127.0.0.1:8080/api/auth/login > /dev/null
          curl --fail --silent --show-error \
            --cookie pilot.cookies \
            http://127.0.0.1:8080/api/auth/session \
            | grep --fixed-strings '"username":"ci-pilot"'
          curl --fail --silent --show-error \
            --cookie pilot.cookies \
            --header 'Content-Type: application/json' \
            --data '{"ingestion_batch_id":"epic-34-3-durability","invoices":[{"id":"INV-34-3","date":"2026-08-24","amount":"125.50","currency":"EUR","reference":"PILOT-34-3"}],"payments":[{"id":"PAY-34-3","date":"2026-08-24","amount":"125.50","currency":"EUR","reference":"PILOT-34-3"}]}' \
            http://127.0.0.1:8080/api/reconciliation/runs/ingest > pilot-run.json
          RUN_ID=$(jq --raw-output .run_id pilot-run.json)
          test -n "$RUN_ID"
          curl --fail --silent --show-error --cookie pilot.cookies \
            "http://127.0.0.1:8080/api/reconciliation/runs/$RUN_ID" \
            | grep --fixed-strings "$RUN_ID"
          docker compose -f docker-compose.pilot.yml down --remove-orphans
          docker compose -f docker-compose.pilot.yml up --detach --wait
          curl --fail --silent --show-error \
            --cookie-jar pilot.cookies \
            --header 'Content-Type: application/json' \
            --data '{"credential":"ci-pilot-credential"}' \
            http://127.0.0.1:8080/api/auth/login > /dev/null
          curl --fail --silent --show-error --cookie pilot.cookies \
            "http://127.0.0.1:8080/api/reconciliation/runs/$RUN_ID" \
            | grep --fixed-strings "$RUN_ID"
          docker compose -f docker-compose.pilot.yml stop
          mkdir -p .pilot-backups
          docker compose -f docker-compose.pilot.yml run --rm --no-deps \
            -v "$PWD/.pilot-backups:/backups" backend \
            python -m invomatch.operations.pilot_state backup \
              --state-root /var/lib/invomatch \
              --bundle /backups/ci-backup \
              --application-version 0.1.0 \
              --source-commit-sha "$INVOMATCH_RELEASE_COMMIT_SHA" \
              --environment production
          ! grep --recursive --fixed-strings 'ci-pilot-credential' .pilot-backups
          docker compose -f docker-compose.pilot.yml down --volumes --remove-orphans
          docker compose -f docker-compose.pilot.yml run --rm --no-deps \
            -v "$PWD/.pilot-backups:/backups:ro" backend \
            python -m invomatch.operations.pilot_state restore \
              --bundle /backups/ci-backup \
              --target-root /var/lib/invomatch
          docker compose -f docker-compose.pilot.yml up --detach --wait
          curl --fail --silent --show-error \
            --cookie-jar pilot.cookies \
            --header 'Content-Type: application/json' \
            --data '{"credential":"ci-pilot-credential"}' \
            http://127.0.0.1:8080/api/auth/login > /dev/null
          curl --fail --silent --show-error --cookie pilot.cookies \
            "http://127.0.0.1:8080/api/reconciliation/runs/$RUN_ID" \
            | grep --fixed-strings "$RUN_ID"
          docker compose -f docker-compose.pilot.yml exec -T backend \
            python -m invomatch.operations.pilot_state verify \
              --state-root /var/lib/invomatch
          ! grep --recursive --fixed-strings 'VITE_API_AUTH_TOKEN' ui/invomatch-ui/dist
